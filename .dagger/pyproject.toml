[project]
name = "libcarla"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["dagger-io", "dnsdv-pipeline-framework"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }
dnsdv-pipeline-framework = { path = "../dnsdv-pipeline-framework/dnsdv_pipeline_framework", editable = true }