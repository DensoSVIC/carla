remote_path: "{{ ansible_env.HOME }}/carla"

local_config:
  hosts:
  - name: self
    architecture: amd64
    distro: ubuntu
    hostname: 192.168.90.127
    user: carla

orchestrator: docker
containers:
- name: libcarla
  architecture: arm64
  remote_path: "{{ ansible_env.HOME }}/carla"
  build_host: self
  manual_build:
  - dagger -m deps/LinguaFranca call store-jfrog-credentials --jfrog-token=env://JFROG_TOKEN --jfrog-user=env://JFROG_USER
  - dagger call upload-artifacts
