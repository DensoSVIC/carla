remote_path: "{{ ansible_env.HOME }}/carla"

local_config:
  hosts:
  - name: self
    architecture: amd64
    distro: ubuntu
    hostname: 192.168.90.127
    user: carla
  - name: thor
    architecture: arm64
    distro: ubuntu
    hostname: 192.168.90.105
    user: thor

orchestrator: docker
containers:
- name: libcarla-amd64
  architecture: amd64
  remote_path: "{{ ansible.HOME }}/carla"
  build_host: self
  manual_build:
  - dagger call store-jfrog-credentials --jfrog-token=env://JFROG_TOKEN --jfrog-user=env://JFROG_USER
  - dagger call upload-artifacts --target-self=true

- name: libcarla-arm64
  architecture: arm64
  remote_path: "{{ ansible_env.HOME }}/carla"
  build_host: thor
  manual_build:
  - dagger call store-jfrog-credentials --jfrog-token=env://JFROG_TOKEN --jfrog-user=env://JFROG_USER
  - dagger call upload-artifacts --target-self=true
